[package]
name = "sage"
version = "0.3.0"
edition = "2021"
description = "Linux voice-to-text CLI (record → whisper → text)"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
whisper-rs = "0.14"
ureq = { version = "2", default-features = false, features = ["tls"] }
toml = "0.8"
arboard = "3"
ctrlc = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
