[package]
name = "sage"
version = "0.3.0"
edition = "2021"
description = "Fast, offline Linux speech-to-text CLI"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
transcribe-cpp = { version = "0.1.3", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
toml = "0.8"
arboard = "3"
ctrlc = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
futures-util = "0.3"
fs2 = "0.4"
libc = "0.2"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
atspi = { version = "0.30", features = ["tokio", "zbus"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
